[package]
name = "supernova_db"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
description = "Supernova DB — a more powerful custom Rust database with rich query operators, schema metadata, restore support, and durable checkpoints"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
