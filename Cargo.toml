[package]
name = "supernova_db"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Supernova DB — a custom Rust database with atomic WAL transactions, secondary indexes, and a bounded network protocol"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
