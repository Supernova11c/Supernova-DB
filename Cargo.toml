[package]
name = "supernova_db"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "An experimental multi-model Rust database for documents, keyword search, and vector similarity"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.1", features = ["derive"] }
